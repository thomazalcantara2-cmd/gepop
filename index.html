    <!-- SCRIPT DE DIAGNÓSTICO PARA O GOOGLE SITES -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="padding: 40px; font-family: 'Inter', sans-serif; background-color: #fff1f2; color: #9f1239; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                        <h1 style="font-weight: 900; font-size: 24px; text-transform: uppercase; margin-bottom: 10px;">Acesso Bloqueado pelo Google Sites</h1>
                        <p style="font-size: 16px; margin-bottom: 20px; max-width: 600px;">O Google Sites bloqueou a execução da interface (Babel/React) devido às suas políticas rígidas de segurança (CSP) para códigos incorporados diretamente.</p>
                        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #fda4af; width: 100%; max-width: 600px; text-align: left; font-family: monospace; font-size: 13px; color: #e11d48; margin-bottom: 30px; word-break: break-all;">
                            <strong>Erro Capturado pelo Navegador:</strong><br><br>${message}
                        </div>
                        <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">Como resolver definitivamente:</h2>
                        <p style="font-size: 15px; max-width: 600px; line-height: 1.6;">Hospede o seu arquivo HTML original numa plataforma gratuita (como <b>Netlify Drop</b> ou <b>GitHub Pages</b>) e insira usando a opção <b>"Incorporar > Por URL"</b> no Google Sites.</p>
                    </div>
                `;
            }
        };
    </script>

    <!-- Dependências Externas -->

    <style>

<body>
    <div id="root">
        <!-- TELA DE ESPERA PARA EVITAR A TELA BRANCA -->

            <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <h2 style="font-size: 18px; font-weight: 600; color: #1e293b;">Carregando Sistema GEPOP...</h2>
            <p style="margin-top: 10px; font-size: 14px; text-align: center; max-width: 450px;">Se esta tela não desaparecer, significa que o Google Sites bloqueou os scripts necessários para desenhar a interface na tela.</p>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTAnpy3b3lE9ziGHVvgWeaYtZIzZIsizbdJMOFz7A4NO2UcRZgytgdyZndzIRpZfop/exec";

        const CATEGORIAS = ["SEI (entrada) - GEPOP", "Prazos MP", "Despachos - GEPOP", "Ofício SEGEP", "Ofício SAD", "CI- GEPOP/SEGEP/SAD", "PARECER JURÍDICO - GEPOP", "Parecer PGM", "MANIFESTAÇÃO JURÍDICA", "NOTA TÉCNICA GEPOP"];
        const CATEGORIA_ICONS = {
            "SEI (entrada) - GEPOP": "inbox",
            "Prazos MP": "clock",
            "Despachos - GEPOP": "send",
            "Ofício SEGEP": "mail",
            "Ofício SAD": "mail",
            "CI- GEPOP/SEGEP/SAD": "message-square",
            "PARECER JURÍDICO - GEPOP": "scale",
            "Parecer PGM": "scale",
            "MANIFESTAÇÃO JURÍDICA": "gavel",
            "NOTA TÉCNICA GEPOP": "file-text"
        };
        const AUTORES = ["NAYANE MELO", "VIVIAM MINERVINO", "MATHEUS VASCONCELOS", "LUCAS ANTONINO", "HIAGO ANDRADE", "ALINNE BANDEIRA"];
        const TIPOS_DEMANDA = ["DEMANDA DA OUVIDORIA", "DECISÃO JUDICIAL (LICENÇA SEM VENCIMENTO)", "DECISÃO JUDICIAL (REINTEGRAÇÃO OU READMISSÃO)", "ESTÁGIO", "FÉRIAS DE SERVIDOR", "HORAS EXTRAS", "HORÁRIO ESPECIAL", "INSTRUÇÃO PROCESSUAL - INSTRUMENTOS JURÍDICOS", "LIBERAÇÃO DE ACESSOS INTERNOS (SEGEP)", "LICENÇA PARA TRATAMENTO DE SAÚDE", "LICENÇA PARA MANDATO CLASSISTA", "LICENÇA PARA TRATO DE INTERESSE PARTICULAR", "MINUTAS (DECRETO/PORTARIA/LEI/CONVÊNIO/CONTRATO)", "MINISTÉRIO PÚBLICO DO TRABALHO - MPT", "MPPE - MINISTÉRIO PÚBLICO", "NOTA TÉCNICA", "NORMATIZAÇÃO - PORTARIAS", "OFÍCIO CIRCULAR", "PROCESSO ADMINISTRATIVO DISCIPLINAR - PAD", "PLANEJAMENTO ESTRATÉGICO - 100 DIAS", "PARECER JURÍDICO", "PEDIDO DE INFORMAÇÕES - PMJG (INTERNO)", "PARECER PGM", "PERMUTA SERVIDOR", "PAGAMENTO DE QUINQUENIOS", "PROCON", "REQUERIMENTO SERVIDOR (REDUÇÃO DE CARGA HORÁRIA)", "REQUERIMENTO SERVIDOR (PROGRESSÃO FUNCIONAL)", "REQUERIMENTO SERVIDOR (IMPOSTO DE RENDA)", "REQUERIMENTO (GOZO DE LICENÇA PRÊMIO)", "REQUERIMENTO SERVIDOR (EXONERAÇÃO)", "REQUERIMENTO (PRORROGAÇÃO DE POSSE)", "RENOVAÇÃO - CESSÃO DE SERVIDOR EXTERNO (para PMJG)", "REQUERIMENTO SERVIDORA (ESTABILIDADE GESTACIONAL)", "REQUERIMENTO SERVIDOR (GRATIFICAÇÃO | INSALUBRIDADE | RISCO DE VIDA ou SAÚDE)", "REQUERIMENTO CTC", "RENOVAÇÃO DE PVJET - Programa Voluntário de Jornada Estendida de Trabalho", "REQUERIMENTO SERVIDOR (PAGAMENTO FÉRIAS)", "REQUERIMENTOS DIVERSOS (SINDICATOS)", "REQUERIMENTO SERVIDOR (ABONO PERMANÊNCIA)", "REQUERIMENTO SERVIDOR (RESTOS DEIXADOS)", "REQUERIMENTO SERVIDOR (AFASTAMENTO PARA CURSO)", "REQUERIMENTO SERVIDOR (MAJORAÇÃO DE CARGA HORÁRIA)", "REQUERIMENTO SERVIDOR (LICENÇA PRÊMIO EM PECÚNIA)", "SEI", "SELEÇÃO SIMPLIFICADA", "SUBSTITUIÇÃO DE SERVIDOR(A) (FÉRIAS)", "SOLICITAÇÃO DE IMPACTO FINANCEIRO - GRATIFICAÇÕES", "TRIBUNAL DE CONTAS", "VACÂNCIA", "VALORES RETIDOS", "VERBAS RESCISÓRIAS", "ALTERAÇÃO DE LOTAÇÃO DE SERVIDOR(A) NA PMJG", "ANÁLISE DE INSTRUMENTO", "ALTERAÇÃO DE VALOR DE GRATIFICAÇÃO", "ASSINATURAS DE EMPENHO (CONTRATOS)", "AVALIAÇÃO DE DESEMPENHO", "ACÚMULO DE CARGOS", "CESSÃO DE SERVIDOR EXTERNO (para PMJG)", "CESSÃO DE SERVIDOR EXTERNO (DEVOLUÇÃO p Origem)", "CI CIRCULAR", "CORREÇÃO DE PORTARIA (DIVERSOS)", "CONCESSÃO DE FGS / PVGET", "CONVOCAÇÃO PARA JURI POPULAR", "CONSELHO REGIONAL", "CONCURSO", "CPP - CONSELHO DE POLÍTICA FINANCEIRA", "DECISÃO JUDICIAL (POSSE)", "DECISÃO JUDICIAL (BLOQUEIO SALARIAL)", "DECISÃO JUDICIAL (SALDO RESIDUAL DE SERVIDOR)", "DECISÃO JUDICIAL (IMPLANTAÇÃO DE DESCONTOS - PENSÃO ALIMENTÍCIA)", "DECISÃO JUDICIAL (EXONERAÇÃO - PENSÃO ALIMENTÍCIA)", "DECISÃO JUDICIAL (REDUÇÃO DE CARGA HORÁRIA)", "DECISÃO JUDICIAL (GRATIFICAÇÃO)", "DECISÃO JUDICIAL (INFORMAÇÕES FUNCIONAIS E FINANCEIRAS)", "DEPÓSITO JUDICIAL", "DECISÃO JUDICIAL (LICENÇA PRÊMIO EM PECÚNIA)", "TCE", "INSS", "REQUISIÇAO PARA AUDIÊNCIA", "REQUERIMENTO DE SERVIDOR (AUXÍLIO FAMÍLIA)"];

        const STATUS_OPCOES = ["A FAZER", "EM ELABORAÇÃO", "AGUARDANDO", "REALIZADO"];

        const globalCache = {};

        const parseDateFlexible = (dateStr) => {
            if (!dateStr) return null;
            if (dateStr instanceof Date) return dateStr;
            
            if (typeof dateStr === 'string' && dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    return new Date(parts[2], parts[1] - 1, parts[0], 12, 0, 0); 
                }
            }
            
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                d.setHours(12, 0, 0, 0);
                return d;
            }
            return null;
        };

        const formatDate = (dateVal) => {
            if (!dateVal || dateVal === "---") return "---";
            const d = parseDateFlexible(dateVal);
            if (!d) return String(dateVal).split(' ')[0];
            return d.toLocaleDateString('pt-BR');
        };

        const toISODate = (formattedDate) => {
            if(!formattedDate) return '';
            if(formattedDate.includes('-')) return formattedDate.split('T')[0];
            if(formattedDate.includes('/')) {
                const [d, m, y] = formattedDate.split('/');
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return '';
        };

        const calculateDaysLeft = (targetDateStr) => {
            const target = parseDateFlexible(targetDateStr);
            if (!target) return null; 
            
            const today = new Date();
            today.setHours(12, 0, 0, 0);
            target.setHours(12, 0, 0, 0);

            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        };

        const Icon = React.memo(({ name, size = 16, className = "", ...props }) => {
            const elementRef = useRef(null);

            useEffect(() => {
                if (!window.lucide || !elementRef.current) return;

                const formatName = (str) => 
                    str.split('-')
                       .map(part => part.charAt(0).toUpperCase() + part.slice(1))
                       .join('');

                const iconName = formatName(name);
                const iconNode = window.lucide.icons[iconName];

                if (iconNode) {
                    const svg = window.lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    if (className) svg.setAttribute('class', className);
                    
                    elementRef.current.innerHTML = '';
                    elementRef.current.appendChild(svg);
                } else {
                    console.warn(`Ícone não encontrado: ${name}`);
                }
            }, [name, size, className]);

            return <span ref={elementRef} style={{ display: 'inline-flex', verticalAlign: 'middle' }} {...props} />
        });

        function SearchableSelect({ label, placeholder, options, value, onChange, allowNew = false }) {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState("");
            const containerRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) setIsOpen(false);
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const filteredOptions = options.filter(opt => 
                opt.toLowerCase().includes(search.toLowerCase())
            );

            const handleSelect = (val) => {
                onChange(val);
                setIsOpen(false);
                setSearch("");
            };

            return (
                <div className="space-y-1 relative col-span-2 md:col-span-1" ref={containerRef}>
                    <label className="text-[10px] font-black uppercase text-slate-400 px-1">{label}</label>
                    <div 
                        className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-slate-800 cursor-pointer flex justify-between items-center"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <span className={value ? "text-slate-800" : "text-slate-400"}>
                            {value || "Selecionar..."}
                        </span>
                        <Icon name="chevron-down" size={16} className={`transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </div>

                    {isOpen && (
                        <div className="absolute z-[110] top-full left-0 right-0 mt-2 bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                            <div className="p-3 border-b bg-slate-50">
                                <input 
                                    autoFocus
                                    type="text" 
                                    placeholder="Pesquisar..." 
                                    className="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-bold text-sm"
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                />
                            </div>
                            <div className="max-h-60 overflow-y-auto no-scrollbar">
                                {filteredOptions.length > 0 ? (
                                    filteredOptions.map(opt => (
                                        <div 
                                            key={opt} 
                                            className="px-6 py-3 hover:bg-indigo-50 cursor-pointer font-bold text-slate-700 text-sm transition-colors border-b border-slate-50 last:border-0"
                                            onClick={() => handleSelect(opt)}
                                        >
                                            {opt}
                                        </div>
                                    ))
                                ) : (
                                    allowNew && search.trim() !== "" ? (
                                        <div 
                                            className="px-6 py-4 hover:bg-emerald-50 cursor-pointer flex items-center gap-3"
                                            onClick={() => handleSelect(search.toUpperCase())}
                                        >
                                            <div className="bg-emerald-100 p-1.5 rounded-lg text-emerald-600"><Icon name="plus" size={14} /></div>
                                            <div>
                                                <p className="text-xs font-black text-emerald-700 uppercase">Criar Novo Tipo</p>
                                                <p className="text-[10px] font-bold text-emerald-600/70">"{search.toUpperCase()}"</p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="px-6 py-8 text-center text-slate-400 italic text-xs">Nenhum resultado encontrado</div>
                                    )
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function DashboardView({ data }) {
            const barChartRef = useRef(null);
            const doughnutChartRef = useRef(null);
            const chartsInstance = useRef({ bar: null, doughnut: null });

            const stats = useMemo(() => {
                const total = data.length;
                const porStatus = data.reduce((acc, curr) => {
                    acc[curr.status] = (acc[curr.status] || 0) + 1;
                    return acc;
                }, {});

                const porDemanda = data.reduce((acc, curr) => {
                    acc[curr.tipoDemanda] = (acc[curr.tipoDemanda] || 0) + 1;
                    return acc;
                }, {});

                return { total, porStatus, porDemanda };
            }, [data]);

            useEffect(() => {
                if (!barChartRef.current || !doughnutChartRef.current) return;

                if (chartsInstance.current.bar) chartsInstance.current.bar.destroy();
                if (chartsInstance.current.doughnut) chartsInstance.current.doughnut.destroy();

                const demandaLabels = Object.keys(stats.porDemanda).sort((a, b) => stats.porDemanda[b] - stats.porDemanda[a]).slice(0, 8);
                const demandaValues = demandaLabels.map(l => stats.porDemanda[l]);

                chartsInstance.current.bar = new Chart(barChartRef.current, {
                    type: 'bar',
                    data: {
                        labels: demandaLabels,
                        datasets: [{
                            label: 'Total',
                            data: demandaValues,
                            backgroundColor: '#6366f1',
                            borderRadius: 8,
                            barThickness: 32
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' } } } }
                    }
                });

                const statusLabels = Object.keys(stats.porStatus);
                const statusValues = statusLabels.map(l => stats.porStatus[l]);
                const statusColors = ['#94a3b8', '#3b82f6', '#f97316', '#22c55e'];

                chartsInstance.current.doughnut = new Chart(doughnutChartRef.current, {
                    type: 'doughnut',
                    data: {
                        labels: statusLabels,
                        datasets: [{
                            data: statusValues,
                            backgroundColor: statusColors,
                            borderWidth: 0,
                            hoverOffset: 20
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { size: 11, weight: 'bold' } } } }
                    }
                });
            }, [stats]);

            const downloadChart = (ref, filename) => {
                const link = document.createElement('a');
                link.download = `${filename}.png`;
                link.href = ref.current.toDataURL('image/png');
                link.click();
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Geral</p>
                            <p className="text-4xl font-black text-slate-900">{stats.total}</p>
                        </div>
                        {STATUS_OPCOES.map((s, idx) => (
                            <div key={s} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm border-l-4" style={{ borderLeftColor: ['#94a3b8', '#3b82f6', '#f97316', '#22c55e'][idx] }}>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">{s}</p>
                                <p className="text-4xl font-black text-slate-900">{stats.porStatus[s] || 0}</p>
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-[480px] flex flex-col transition-all hover:shadow-xl relative group">
                            <div className="flex justify-between items-center mb-8">
                                <h3 className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 flex items-center gap-2">
                                    <Icon name="bar-chart-2" size={14} /> Ranking de Demandas
                                </h3>
                                <button 
                                    onClick={() => downloadChart(barChartRef, 'GEPOP_Ranking_Demandas')}
                                    className="p-2 bg-slate-50 hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 rounded-lg transition-all opacity-0 group-hover:opacity-100 flex items-center gap-2"
                                    title="Exportar como Imagem (PNG)"
                                    aria-label="Exportar gráfico de ranking como imagem"
                                >
                                    <Icon name="download" size={14} />
                                </button>
                            </div>
                            <div className="flex-1 min-h-0"><canvas ref={barChartRef} id="canvas-bar"></canvas></div>
                        </div>
                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm h-[480px] flex flex-col transition-all hover:shadow-xl relative group">
                            <div className="flex justify-between items-center mb-8">
                                <h3 className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 flex items-center gap-2">
                                    <Icon name="pie-chart" size={14} /> Participação Percentual
                                </h3>
                                <button 
                                    onClick={() => downloadChart(doughnutChartRef, 'GEPOP_Participacao_Percentual')}
                                    className="p-2 bg-slate-50 hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 rounded-lg transition-all opacity-0 group-hover:opacity-100 flex items-center gap-2"
                                    title="Exportar como Imagem (PNG)"
                                    aria-label="Exportar gráfico de participação como imagem"
                                >
                                    <Icon name="download" size={14} />
                                </button>
                            </div>
                            <div className="flex-1 min-h-0"><canvas ref={doughnutChartRef} id="canvas-doughnut"></canvas></div>
                        </div>
                    </div>
                </div>
            );
        }

        function ColumnFilterIcon({ value, onChange, options, allLabel = "Todos" }) {
            const isActive = Boolean(value);
            return (
                <span className="relative inline-flex items-center justify-center w-4 h-4 flex-shrink-0" title={isActive ? `Filtro: ${value}` : "Filtrar coluna"}>
                    <Icon name="filter" size={11} className={isActive ? "text-indigo-500" : "text-slate-300 hover:text-slate-400"} />
                    <select
                        value={value}
                        onChange={e => onChange(e.target.value)}
                        onClick={e => e.stopPropagation()}
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer normal-case"
                    >
                        <option value="">{allLabel}</option>
                        {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                </span>
            );
        }

        function ExpandableObjectCell({ text }) {
            const [isExpanded, setIsExpanded] = useState(false);
            const needsExpansion = text && text.length > 60;
            return (
                <div className="flex flex-col gap-1">
                    <div className={isExpanded ? "expanded-text" : "clamp-text"}>
                        <span className="text-slate-600 italic leading-relaxed whitespace-pre-wrap text-[12px]">{text}</span>
                    </div>
                    {needsExpansion && (
                        <button onClick={() => setIsExpanded(!isExpanded)} className="text-[10px] font-bold text-indigo-600 hover:underline flex items-center gap-1 mt-1 transition-colors uppercase w-fit">
                            {isExpanded ? "Recolher" : "Ver mais"}
                        </button>
                    )}
                </div>
            );
        }

        const normalizeText = (str) => String(str ?? "").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        const matchesSearchTerm = (record, term) => {
            if (!term) return true;
            const t = normalizeText(term);
            return (
                normalizeText(record.numSei).includes(t) ||
                normalizeText(record.displayId).includes(t) ||
                normalizeText(record.objeto).includes(t) ||
                normalizeText(record.autor).includes(t) ||
                normalizeText(record.tipoDemanda).includes(t)
            );
        };

        const fetchCategoryData = async (cat) => {
            const response = await fetch(`${APPS_SCRIPT_URL}?categoria=${encodeURIComponent(cat)}`);
            if (!response.ok) throw new Error(`Falha na conexão com a planilha (HTTP ${response.status})`);
            const data = await response.json();
            if (!Array.isArray(data)) throw new Error("A planilha retornou um formato de dados inesperado.");

            const mapped = data.map((item, index) => {
                const rawPrazo = item.prazo || item.Prazo || item.PRAZO || item["Prazo Fatal"] || item["Data Limite"] || item["Vencimento"] || null;
                const rawStatus = item.status || item.Status || item.STATUS || "A FAZER";
                const rawUrgente = item.urgente || item.Urgente || item.URGENTE || false;

                let finalDisplayId = String(item.id ?? item.sequencial ?? "---");
                if (!cat.includes("Ofício")) {
                    finalDisplayId = String(index + 1).padStart(3, '0');
                }

                const rawLink = item.link_gdrive || item.linkgdrive || item["Link GDrive"] || item["LINK GDRIVE"] || item.link || item.Link || item.LINK || item["Link do GDrive"] || "";

                return {
                    id: index,
                    displayId: finalDisplayId,
                    numSei: String(item.numero_sei ?? item.numsei ?? "---"),
                    linkGDrive: (rawLink && rawLink !== "undefined") ? String(rawLink).trim() : "",
                    tipoDemanda: String(item.tipo_de_demanda ?? item.tipodemanda ?? "---"),
                    objeto: String(item.objeto ?? "---"),
                    autor: String(item.autor ?? "---"),
                    categoria: cat,
                    data: formatDate(item.data),
                    prazo: rawPrazo,
                    status: rawStatus,
                    urgente: rawUrgente === true || String(rawUrgente).toLowerCase() === "true"
                };
            });
            globalCache[cat] = mapped;
            return mapped;
        };

        function App() {
            const [records, setRecords] = useState([]);
            const [activeTab, setActiveTab] = useState(CATEGORIAS[0]);
            const [viewMode, setViewMode] = useState('table');
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [originalNumSei, setOriginalNumSei] = useState("");
            const [visibleCount, setVisibleCount] = useState(50);
            const [copyStatus, setCopyStatus] = useState(null);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
                try { return localStorage.getItem('gepop_sidebar_collapsed') === 'true'; } catch (e) { return false; }
            });
            const [sortColumn, setSortColumn] = useState('default');
            const [sortOrder, setSortOrder] = useState('desc');
            
            const [searchTerm, setSearchTerm] = useState("");
            const [filterDate, setFilterDate] = useState("");
            const [filterDateTo, setFilterDateTo] = useState("");
            const [filterAutor, setFilterAutor] = useState("");
            const [filterDemanda, setFilterDemanda] = useState("");

            const [duplicateWarning, setDuplicateWarning] = useState(false);
            
            const [dynamicTiposDemanda, setDynamicTiposDemanda] = useState(TIPOS_DEMANDA);

            const [delConfirm, setDelConfirm] = useState({ show: false, numSei: "", cat: "" });
            const [formData, setFormData] = useState({ 
                numSei: "", linkGDrive: "", tipoDemanda: "", objeto: "", autor: "", 
                categoria: CATEGORIAS[0], numManual: "", dataManual: "",
                prazo: "", status: "", urgente: false 
            });

            const [daysInput, setDaysInput] = useState("");

            const sortedTiposDemanda = useMemo(() => {
                return [...dynamicTiposDemanda].sort((a, b) => a.localeCompare(b));
            }, [dynamicTiposDemanda]);

            const handleDaysChange = (val) => {
                setDaysInput(val);
                if (val && !isNaN(val)) {
                    const d = new Date();
                    d.setHours(12, 0, 0, 0); 
                    d.setDate(d.getDate() + parseInt(val));
                    setFormData(prev => ({...prev, prazo: d.toISOString().split('T')[0]}));
                } else {
                    setFormData(prev => ({...prev, prazo: ""}));
                }
            };

            const copyToClipboard = (text) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => { setCopyStatus(text); setTimeout(() => setCopyStatus(null), 2000); })
                        .catch(() => copyToClipboardFallback(text));
                } else {
                    copyToClipboardFallback(text);
                }
            };

            const copyToClipboardFallback = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text; document.body.appendChild(textArea); textArea.select();
                try { document.execCommand('copy'); setCopyStatus(text); setTimeout(() => setCopyStatus(null), 2000); } catch (err) { console.error(err); }
                document.body.removeChild(textArea);
            };

            const loadData = useCallback(async (cat = activeTab, force = false) => {
                if (!force && globalCache[cat]) {
                    setRecords(globalCache[cat]);
                    setLoading(false);
                    setErrorMsg(null);
                    return;
                }
                setLoading(true);
                try {
                    const mapped = await fetchCategoryData(cat);
                    if (cat === activeTab) {
                        setRecords(mapped);
                        setVisibleCount(50);
                    }
                    setErrorMsg(null);
                } catch (e) {
                    console.error(e);
                    setErrorMsg(e.message || "Não foi possível carregar os dados da planilha. Verifique sua conexão e tente novamente.");
                }
                finally { setLoading(false); }
            }, [activeTab]);

            const [searchAllChannels, setSearchAllChannels] = useState(false);
            const [loadingGlobalSearch, setLoadingGlobalSearch] = useState(false);

            const ensureAllCategoriesLoaded = useCallback(async () => {
                const missing = CATEGORIAS.filter(cat => !globalCache[cat]);
                if (missing.length === 0) return;
                setLoadingGlobalSearch(true);
                try {
                    await Promise.all(missing.map(cat => fetchCategoryData(cat).catch(e => console.error(`Falha ao carregar ${cat}:`, e))));
                } finally {
                    setLoadingGlobalSearch(false);
                }
            }, []);

            useEffect(() => { loadData(activeTab); }, [activeTab, loadData]);

            useEffect(() => {
                if (searchAllChannels) ensureAllCategoriesLoaded();
            }, [searchAllChannels, ensureAllCategoriesLoaded]);

            useEffect(() => {
                if (records.length > 0) {
                    const tiposNoBanco = records
                        .map(r => r.tipoDemanda)
                        .filter(t => t && t !== "---" && t.trim() !== "");
                    
                    setDynamicTiposDemanda(prevList => {
                        const listaUnificada = new Set([...TIPOS_DEMANDA, ...prevList, ...tiposNoBanco]);
                        return Array.from(listaUnificada).sort((a, b) => a.localeCompare(b));
                    });
                }
            }, [records]);

            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key !== 'Escape' || syncing) return;
                    if (showModal) setShowModal(false);
                    if (delConfirm.show) setDelConfirm({ show: false, numSei: "", cat: "" });
                };
                document.addEventListener('keydown', handleEsc);
                return () => document.removeEventListener('keydown', handleEsc);
            }, [showModal, delConfirm.show, syncing]);

            useEffect(() => {
                try { localStorage.setItem('gepop_sidebar_collapsed', String(sidebarCollapsed)); } catch (e) {}
            }, [sidebarCollapsed]);

            const handleSave = async (e) => {
                e.preventDefault(); setSyncing(true);
                const isManual = formData.categoria.includes("Ofício");
                const nextSeq = String(records.length + 1).padStart(3, '0');
                
                let prazoParaSalvar = formData.prazo;
                if (prazoParaSalvar && prazoParaSalvar.includes('-')) {
                    const [y, m, d] = prazoParaSalvar.split('-');
                    prazoParaSalvar = `${d}/${m}/${y}`;
                }

                const payload = { 
                    action: editMode ? "edit" : "insert", 
                    ...formData,
                    originalNumSei: editMode ? originalNumSei : formData.numSei,
                    link_gdrive: formData.linkGDrive,
                    linkgdrive: formData.linkGDrive,
                    "Link GDrive": formData.linkGDrive,
                    "Link do GDrive": formData.linkGDrive,
                    link: formData.linkGDrive,
                    
                    prazo: prazoParaSalvar,
                    Prazo: prazoParaSalvar,
                    PRAZO: prazoParaSalvar,
                    "Prazo Fatal": prazoParaSalvar,
                    "Data Limite": prazoParaSalvar,
                    "Vencimento": prazoParaSalvar,
                    
                    status: formData.status,
                    Status: formData.status,
                    
                    urgente: String(formData.urgente),
                    Urgente: String(formData.urgente),
                    
                    displayId: (isManual || editMode) ? formData.numManual : nextSeq 
                };

                try {
                    await fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
                    setShowModal(false);
                    setErrorMsg(null);
                    delete globalCache[formData.categoria];
                    setTimeout(() => loadData(formData.categoria, true), 2500);
                } catch (err) { console.error(err); setErrorMsg("Não foi possível enviar os dados para a planilha. Tente novamente."); }
                finally { setSyncing(false); }
            };

            const handleDelete = async () => {
                setSyncing(true);
                const targetCat = delConfirm.cat;
                try {
                    await fetch(APPS_SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", numSei: delConfirm.numSei, categoria: targetCat }) });
                    setDelConfirm({ show: false, numSei: "", cat: "" });
                    setErrorMsg(null);
                    delete globalCache[targetCat];
                    setTimeout(() => loadData(targetCat, true), 2000);
                } catch (e) {
                    console.error(e);
                    setErrorMsg("Não foi possível excluir o registro. Tente novamente.");
                } finally { setSyncing(false); }
            };

            const checkDuplicate = (seiNumber, category, currentOriginal = "") => {
                if (category !== "SEI (entrada) - GEPOP") return false;
                if (editMode && seiNumber === currentOriginal) return false;
                
                if (activeTab === "SEI (entrada) - GEPOP") {
                    return records.some(r => r.numSei === seiNumber && (!editMode || r.numSei !== currentOriginal));
                }
                if (globalCache["SEI (entrada) - GEPOP"]) {
                    return globalCache["SEI (entrada) - GEPOP"].some(r => r.numSei === seiNumber && (!editMode || r.numSei !== currentOriginal));
                }
                return false;
            };

            const filteredRecords = useMemo(() => {
                let result = records.filter(r => {
                    const matchesSearch = matchesSearchTerm(r, searchTerm);
                    const recDateISO = toISODate(r.data);
                    const matchesDate = (filterDate === "" || recDateISO >= filterDate) && (filterDateTo === "" || recDateISO <= filterDateTo);
                    const matchesAutor = filterAutor === "" || r.autor === filterAutor;
                    const matchesDemanda = filterDemanda === "" || r.tipoDemanda === filterDemanda;
                    return matchesSearch && matchesDate && matchesAutor && matchesDemanda;
                });
                if (activeTab === "Prazos MP") {
                    result.sort((a, b) => {
                        if (sortColumn === 'id') {
                            const idA = parseInt(a.displayId) || 0;
                            const idB = parseInt(b.displayId) || 0;
                            return sortOrder === 'desc' ? idB - idA : idA - idB;
                        } else {
                            if (a.urgente !== b.urgente) return a.urgente ? -1 : 1;
                            if (!a.prazo && !b.prazo) return 0;
                            if (!a.prazo) return 1; 
                            if (!b.prazo) return -1;
                            const dateA = parseDateFlexible(a.prazo);
                            const dateB = parseDateFlexible(b.prazo);
                            const valA = dateA ? dateA.getTime() : 0;
                            const valB = dateB ? dateB.getTime() : 0;
                            
                            if (sortColumn === 'default') {
                                return valA - valB;
                            }
                            return sortOrder === 'desc' ? valB - valA : valA - valB;
                        }
                    });
                } else {
                    result.sort((a, b) => { 
                        if (sortColumn === 'data') {
                            const dateA = parseDateFlexible(a.data);
                            const dateB = parseDateFlexible(b.data);
                            const valA = dateA ? dateA.getTime() : 0;
                            const valB = dateB ? dateB.getTime() : 0;
                            return sortOrder === 'desc' ? valB - valA : valA - valB;
                        } else {
                            const idA = parseInt(a.displayId) || 0; 
                            const idB = parseInt(b.displayId) || 0; 
                            return sortOrder === 'desc' ? idB - idA : idA - idB; 
                        }
                    });
                }
                return result;
            }, [records, searchTerm, filterDate, filterDateTo, filterAutor, filterDemanda, sortColumn, sortOrder, activeTab]);

            const isGlobalSearchActive = searchAllChannels && searchTerm.trim() !== "";

            const globalSearchResults = useMemo(() => {
                if (!isGlobalSearchActive) return [];
                let result = CATEGORIAS.flatMap(cat => globalCache[cat] || []).filter(r => {
                    const matchesSearch = matchesSearchTerm(r, searchTerm);
                    const recDateISO = toISODate(r.data);
                    const matchesDate = (filterDate === "" || recDateISO >= filterDate) && (filterDateTo === "" || recDateISO <= filterDateTo);
                    const matchesAutor = filterAutor === "" || r.autor === filterAutor;
                    const matchesDemanda = filterDemanda === "" || r.tipoDemanda === filterDemanda;
                    return matchesSearch && matchesDate && matchesAutor && matchesDemanda;
                });
                result.sort((a, b) => {
                    const dateA = parseDateFlexible(a.data);
                    const dateB = parseDateFlexible(b.data);
                    const valA = dateA ? dateA.getTime() : 0;
                    const valB = dateB ? dateB.getTime() : 0;
                    return valB - valA;
                });
                return result;
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [isGlobalSearchActive, searchTerm, filterDate, filterDateTo, filterAutor, filterDemanda, loadingGlobalSearch]);

            const displayRecords = isGlobalSearchActive ? globalSearchResults : filteredRecords;
            const paginatedRecords = useMemo(() => displayRecords.slice(0, visibleCount), [displayRecords, visibleCount]);

            const exportToExcel = () => {
                const dataToExport = displayRecords.map(r => ({ ID: r.displayId, Canal: r.categoria, Data: r.data, "Número SEI": r.numSei, "Link GDRIVE": r.linkGDrive, Classificação: r.tipoDemanda, Autor: r.autor, Objeto: r.objeto, Status: r.status, Prazo: r.prazo ? formatDate(r.prazo) : "-" }));
                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, "Registros");
                XLSX.writeFile(workbook, `GEPOP_ControleSEI_${isGlobalSearchActive ? "BuscaGlobal" : activeTab.split(' ')[0]}.xlsx`);
            };

            const exportToPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                doc.setFillColor(15, 23, 42); doc.rect(0, 0, pageWidth, 25, 'F');
                doc.setFontSize(16); doc.setTextColor(255, 255, 255);

                const tituloAba = isGlobalSearchActive ? "Busca em Todos os Canais" : (activeTab === "Prazos MP" ? "PRAZOS" : activeTab);
                doc.text(`Listagem: ${tituloAba}`, 15, 16);

                const tableData = displayRecords.map(r => isGlobalSearchActive ? [r.categoria, r.data, r.numSei, r.tipoDemanda, r.autor, r.objeto] : [r.displayId, r.data, r.numSei, r.tipoDemanda, r.autor, r.objeto]);
                const head = isGlobalSearchActive ? [['CANAL', 'DATA', 'SEI', 'CLASSIFICAÇÃO', 'AUTOR', 'OBJETO']] : [['ID', 'DATA', 'SEI', 'CLASSIFICAÇÃO', 'AUTOR', 'OBJETO']];
                doc.autoTable({ startY: 32, head, body: tableData });
                doc.save(`GEPOP_${isGlobalSearchActive ? "BuscaGlobal" : tituloAba}.pdf`);
            };

            const handleSort = (col) => {
                if (sortColumn === col || (sortColumn === 'default' && col === 'id')) {
                    setSortOrder(prev => prev === 'desc' ? 'asc' : 'desc');
                } else {
                    setSortColumn(col);
                    setSortOrder('desc');
                }
            };

            const StatusBadge = ({ status }) => {
                let className = "status-badge ";
                switch (status) {
                    case "A FAZER": className += "status-afazer"; break;
                    case "EM ELABORAÇÃO": className += "status-elaboracao"; break;
                    case "AGUARDANDO": className += "status-aguardando"; break;
                    case "REALIZADO": className += "status-realizado"; break;
                    default: className += "status-afazer";
                }
                return <span className={className}>{status || "A FAZER"}</span>;
            };

            const PrazoCell = ({ prazoStr, status }) => {
                const daysLeft = calculateDaysLeft(prazoStr);
                if (daysLeft === null) return <span className="text-slate-300">---</span>;
                
                if (status === "REALIZADO") {
                     return (
                        <div className="flex items-center gap-2 px-2 py-1 rounded-lg w-fit text-emerald-600 bg-emerald-50 opacity-70">
                            <Icon name="check-circle" size={12} />
                            <span className="text-[10px] uppercase font-bold">Concluído</span>
                        </div>
                    );
                }
                
                let colorClass = "text-emerald-600 bg-emerald-50";
                let iconName = "clock";
                if (daysLeft < 0) { colorClass = "text-rose-600 bg-rose-50 font-bold"; iconName = "alert-circle"; }
                else if (daysLeft <= 3) { colorClass = "text-rose-600 bg-rose-50 font-bold"; iconName = "alert-octagon"; }
                else if (daysLeft <= 7) { colorClass = "text-amber-600 bg-amber-50 font-bold"; iconName = "alert-triangle"; }

                return (
                    <div className={`flex items-center gap-2 px-2 py-1 rounded-lg w-fit ${colorClass}`}>
                        <Icon name={iconName} size={12} />
                        <span className="text-[10px] uppercase font-bold">{daysLeft < 0 ? `Vencido (${Math.abs(daysLeft)}d)` : `${daysLeft} dias`}</span>
                    </div>
                );
            };

            const isPrazosTab = activeTab === "Prazos MP";
            const hasActiveFilters = Boolean(searchTerm || filterDate || filterDateTo || filterAutor || filterDemanda);
            const clearFilters = () => { setSearchTerm(""); setFilterDate(""); setFilterDateTo(""); setFilterAutor(""); setFilterDemanda(""); };

            const Hyperlink = ({ url }) => {
                if (!url || url === "---" || url === "" || url === "undefined") {
                    return (
                        <div className="flex justify-center" title="Nenhum link cadastrado">
                            <div className="p-2 rounded-lg text-slate-200"><Icon name="folder" size={16} /></div>
                        </div>
                    );
                }

                const href = url.startsWith('http') ? url : `https://${url}`;

                return (
                    <div className="flex justify-center">
                        <a
                            href={href}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="p-2 rounded-lg text-indigo-600 bg-indigo-50 hover:bg-indigo-100 hover:text-indigo-800 transition-all inline-flex"
                            title="Abrir pasta no Google Drive"
                            aria-label="Abrir pasta no Google Drive"
                        >
                            <Icon name="folder-open" size={16} />
                        </a>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-10 flex flex-col selection:bg-indigo-100">
                    {copyStatus && <div className="copy-toast"><Icon name="check-circle" className="text-emerald-400" />Número SEI copiado!</div>}
                    {syncing && !copyStatus && <div className="copy-toast"><div className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>Sincronizando com a planilha...</div>}

                    <header className="bg-slate-50 text-slate-800 h-16 flex items-center px-6 justify-between shadow-sm border-b-2 border-indigo-200 sticky top-0 z-50">
                        <div className="flex items-center gap-4 min-w-0">
                            <div className="bg-indigo-100 p-2 rounded-xl border border-indigo-200 flex-shrink-0">
                                <img src="https://i.ibb.co/8gvSn7GH/logotop-1.webp" alt="Logo GEPOP" className="w-8 h-8 object-contain" />
                            </div>
                            <div className="min-w-0">
                                <h1 className="text-lg font-black tracking-tighter uppercase leading-none text-slate-900">GEPOP - <span className="text-indigo-600 font-light tracking-normal italic">Controle SEI</span></h1>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-lg">
                                <button onClick={() => setViewMode('table')} className={`p-1.5 rounded-md transition-all ${viewMode === 'table' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:text-indigo-600'}`} title="Ver como tabela" aria-label="Ver como tabela"><Icon name="table" size={15} /></button>
                                <button onClick={() => setViewMode('charts')} className={`p-1.5 rounded-md transition-all ${viewMode === 'charts' ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:text-indigo-600'}`} title="Ver dashboard" aria-label="Ver dashboard"><Icon name="bar-chart-3" size={15} /></button>
                            </div>
                            <button onClick={() => loadData(activeTab, true)} className="p-2 hover:bg-white border border-transparent hover:border-slate-200 rounded-lg transition-all" title="Atualizar Base" aria-label="Atualizar Base"><Icon name="refresh-cw" className={`w-4 h-4 text-slate-500 ${loading ? 'animate-spin' : ''}`} /></button>
                            <button onClick={() => {
                                setEditMode(false);
                                setOriginalNumSei("");
                                setFormData({ ...formData, numSei: "", linkGDrive: "", tipoDemanda: "", objeto: "", autor: "", categoria: activeTab, numManual: "", dataManual: "", prazo: "", status: "A FAZER", urgente: false });
                                setDaysInput("");
                                setDuplicateWarning(false);
                                setShowModal(true);
                            }} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest shadow-sm hover:bg-indigo-700 transition-all active:scale-95 flex items-center gap-2">
                                <Icon name="plus" size={16} strokeWidth={3} /> Novo Registro
                            </button>
                        </div>
                    </header>

                    <main className="max-w-[100%] mx-auto p-4 space-y-4 animate-fade-in">
                        {errorMsg && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-4 flex items-center justify-between gap-4 shadow-sm animate-fade-in">
                                <div className="flex items-center gap-3">
                                    <div className="bg-rose-100 p-2 rounded-xl"><Icon name="wifi-off" size={18} /></div>
                                    <p className="text-xs font-bold">{errorMsg}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => loadData(activeTab, true)} className="px-4 py-2 bg-white border border-rose-200 rounded-lg text-[10px] font-black uppercase text-rose-600 hover:bg-rose-100 transition-all flex items-center gap-2"><Icon name="refresh-cw" size={12} /> Tentar novamente</button>
                                    <button onClick={() => setErrorMsg(null)} className="p-2 text-rose-400 hover:text-rose-600" aria-label="Fechar aviso"><Icon name="x" size={16} /></button>
                                </div>
                            </div>
                        )}
                        <div className="flex flex-col lg:flex-row gap-5">
                            <div className={`w-full ${sidebarCollapsed ? 'lg:w-[60px]' : 'lg:w-[210px]'} flex-shrink-0 transition-all duration-200`}>
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden lg:sticky lg:top-20">
                                    <div className={`hidden lg:flex items-center ${sidebarCollapsed ? 'justify-center' : 'justify-between'} px-3 py-3 border-b border-slate-100 bg-slate-50`}>
                                        <h4 className={`text-[9px] font-black text-slate-400 uppercase tracking-widest ${sidebarCollapsed ? 'hidden' : ''}`}>Canais</h4>
                                        <button onClick={() => setSidebarCollapsed(prev => !prev)} className="flex items-center justify-center p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-white transition-all" title={sidebarCollapsed ? "Expandir menu" : "Recolher menu"} aria-label={sidebarCollapsed ? "Expandir menu" : "Recolher menu"}>
                                            <Icon name={sidebarCollapsed ? "chevron-right" : "chevron-left"} size={14} />
                                        </button>
                                    </div>
                                    <div className={`p-2 ${sidebarCollapsed ? 'lg:p-1.5' : ''} flex lg:flex-col gap-1.5 overflow-x-auto lg:overflow-visible no-scrollbar`}>
                                        {CATEGORIAS.map(cat => {
                                            const isActive = activeTab === cat;
                                            const isPrazos = cat === "Prazos MP";
                                            const label = isPrazos ? "PRAZOS" : cat.split(' - ')[0];
                                            return (
                                                <button key={cat} onClick={() => { setActiveTab(cat); setViewMode('table'); }} title={cat} className={`category-pill text-left ${sidebarCollapsed ? 'lg:px-2 lg:justify-center' : 'px-4 justify-between'} py-2.5 rounded-xl text-[10px] font-bold uppercase transition-all flex items-center gap-2 whitespace-nowrap group ${isActive ? "sidebar-active" : "text-slate-500 bg-slate-50 lg:bg-transparent hover:bg-slate-100"}`}>
                                                    <div className="flex items-center gap-2.5 overflow-hidden">
                                                        <Icon name={CATEGORIA_ICONS[cat] || "folder"} size={13} className={`flex-shrink-0 ${isActive ? "text-indigo-300" : isPrazos ? "text-rose-400" : "text-slate-400"}`} />
                                                        <span className={`truncate ${sidebarCollapsed ? 'lg:hidden' : ''}`}>{label}</span>
                                                    </div>
                                                    <Icon name="chevron-right" size={12} className={`flex-shrink-0 ${sidebarCollapsed ? 'hidden' : 'hidden lg:inline-flex'} ${isActive ? "opacity-60" : "opacity-0 group-hover:opacity-40"} transition-opacity`} />
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 min-w-0 space-y-4">
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-3">
                                    <div className="flex flex-col md:flex-row md:items-end gap-4">
                                        <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Busca</label>
                                                <input type="text" placeholder="Filtrar..." className="filter-input" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                                <label className="flex items-center gap-1.5 pt-1 cursor-pointer select-none w-fit">
                                                    <input type="checkbox" checked={searchAllChannels} onChange={e => setSearchAllChannels(e.target.checked)} className="w-3 h-3 rounded accent-indigo-600 cursor-pointer" />
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wide">Buscar em todos os canais</span>
                                                    {loadingGlobalSearch && <div className="w-3 h-3 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>}
                                                </label>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Período</label>
                                                <div className="flex items-center gap-1">
                                                    <input type="date" className="filter-input flex-1 min-w-0" value={filterDate} max={filterDateTo || undefined} onChange={e => setFilterDate(e.target.value)} title="De" />
                                                    <span className="text-slate-300 text-[10px] font-bold flex-shrink-0">–</span>
                                                    <input type="date" className="filter-input flex-1 min-w-0" value={filterDateTo} min={filterDate || undefined} onChange={e => setFilterDateTo(e.target.value)} title="Até" />
                                                </div>
                                            </div>
                                            <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Autor</label><select className="filter-input" value={filterAutor} onChange={e => setFilterAutor(e.target.value)}><option value="">Todos os Autores</option>{AUTORES.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                                            <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Demanda</label><select className="filter-input" value={filterDemanda} onChange={e => setFilterDemanda(e.target.value)}><option value="">Todas as Demandas</option>{sortedTiposDemanda.map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                                        </div>
                                        <div className="flex gap-2">
                                            {viewMode === 'table' && <button onClick={exportToExcel} className="p-2.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg hover:bg-emerald-100 transition-all flex items-center gap-2 text-[10px] font-black uppercase" aria-label="Exportar para Excel"><Icon name="file-spreadsheet" size={16} /> EXCEL</button>}
                                            <button onClick={exportToPDF} className="p-2.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg hover:bg-rose-100 transition-all flex items-center gap-2 text-[10px] font-black uppercase shadow-lg shadow-rose-100" aria-label="Exportar relatório em PDF"><Icon name="file-text" size={16} /> RELATÓRIO PDF</button>
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-between border-t border-slate-100 pt-3">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                            <span><span className="text-slate-700 font-black">{displayRecords.length}</span> {isGlobalSearchActive ? "resultado(s) em todos os canais" : `de ${records.length} registro${records.length === 1 ? "" : "s"}`}</span>
                                            {isGlobalSearchActive && <span className="inline-flex items-center gap-1 text-indigo-500"><Icon name="globe" size={11} /> Busca global</span>}
                                        </p>
                                        {hasActiveFilters && (
                                            <button onClick={clearFilters} className="flex items-center gap-1.5 text-[10px] font-black uppercase text-indigo-600 hover:text-indigo-800 transition-colors">
                                                <Icon name="x-circle" size={12} /> Limpar filtros
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {viewMode === 'charts' ? (
                                    <DashboardView data={displayRecords} />
                                ) : (
                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl min-h-[500px]">
                                        <div className="table-scroll overflow-x-auto">
                                            {loading ? (
                                                <div className="p-10 space-y-4">{[1,2,3,4,5].map(i => <div key={i} className="h-12 w-full bg-slate-100 rounded-xl animate-pulse-fast"></div>)}</div>
                                            ) : (
                                                <>
                                                    <table className="spreadsheet-table">
                                                        <thead>
                                                            {isGlobalSearchActive ? (
                                                                <tr>
                                                                    <th className="w-[130px]">Canal</th>
                                                                    <th className="w-[100px]">Data</th>
                                                                    <th className="w-[190px]">Número SEI</th>
                                                                    <th className="w-[70px] text-center">Pasta</th>
                                                                    <th className="w-[170px]">
                                                                        <div className="flex items-center gap-1">
                                                                            <span>Classificação</span>
                                                                            <ColumnFilterIcon value={filterDemanda} onChange={setFilterDemanda} options={sortedTiposDemanda} allLabel="Todas" />
                                                                        </div>
                                                                    </th>
                                                                    <th className="w-[130px]">
                                                                        <div className="flex items-center gap-1">
                                                                            <span>Autor</span>
                                                                            <ColumnFilterIcon value={filterAutor} onChange={setFilterAutor} options={AUTORES} allLabel="Todos" />
                                                                        </div>
                                                                    </th>
                                                                    <th className="w-auto">Objeto / Resumo</th>
                                                                    <th className="w-[90px] text-center">Ações</th>
                                                                </tr>
                                                            ) : isPrazosTab ? (
                                                                <tr>
                                                                    <th className="w-[60px] text-center cursor-pointer hover:bg-slate-200 transition-colors group/sort" onClick={() => handleSort('id')}>
                                                                        <div className="flex items-center justify-center gap-1">ID<div className={`flex flex-col ${sortColumn === 'id' || sortColumn === 'default' ? 'opacity-100' : 'opacity-30'}`}><Icon name="chevron-up" className={`w-3 h-3 ${(sortColumn === 'id' || sortColumn === 'default') && sortOrder === 'asc' ? 'text-indigo-600' : ''}`} /><Icon name="chevron-down" className={`w-3 h-3 ${(sortColumn === 'id' || sortColumn === 'default') && sortOrder === 'desc' ? 'text-indigo-600' : ''}`} /></div></div>
                                                                    </th>
                                                                    <th className="w-[50px] text-center" title="Prioridade / Urgência"><Icon name="alert-circle" size={14} /></th>
                                                                    <th className="w-[100px] text-center cursor-pointer hover:bg-slate-200 transition-colors group/sort" onClick={() => handleSort('prazo')}>
                                                                        <div className="flex items-center justify-center gap-1">Prazo Fatal<div className={`flex flex-col ${sortColumn === 'prazo' ? 'opacity-100' : 'opacity-30'}`}><Icon name="chevron-up" className={`w-3 h-3 ${sortColumn === 'prazo' && sortOrder === 'asc' ? 'text-indigo-600' : ''}`} /><Icon name="chevron-down" className={`w-3 h-3 ${sortColumn === 'prazo' && sortOrder === 'desc' ? 'text-indigo-600' : ''}`} /></div></div>
                                                                    </th>
                                                                    <th className="w-[110px] text-center">Contagem</th>
                                                                    <th className="w-[120px] text-center">Status</th>
                                                                    <th className="w-[160px]">Número SEI</th>
                                                                    <th className="w-[70px] text-center">Pasta</th>
                                                                    <th className="w-[100px]">
                                                                        <div className="flex items-center gap-1">
                                                                            <span>Autor</span>
                                                                            <ColumnFilterIcon value={filterAutor} onChange={setFilterAutor} options={AUTORES} allLabel="Todos" />
                                                                        </div>
                                                                    </th>
                                                                    <th className="w-auto">Objeto</th>
                                                                    <th className="w-[80px] text-center">Ações</th>
                                                                </tr>
                                                            ) : (
                                                                <tr>
                                                                    <th className="w-[80px] text-center cursor-pointer hover:bg-slate-200 transition-colors group/sort" onClick={() => handleSort('id')}>
                                                                        <div className="flex items-center justify-center gap-1">ID<div className={`flex flex-col ${sortColumn === 'id' || sortColumn === 'default' ? 'opacity-100' : 'opacity-30'}`}><Icon name="chevron-up" className={`w-3 h-3 ${(sortColumn === 'id' || sortColumn === 'default') && sortOrder === 'asc' ? 'text-indigo-600' : ''}`} /><Icon name="chevron-down" className={`w-3 h-3 ${(sortColumn === 'id' || sortColumn === 'default') && sortOrder === 'desc' ? 'text-indigo-600' : ''}`} /></div></div>
                                                                    </th>
                                                                    <th className="w-[100px] text-center cursor-pointer hover:bg-slate-200 transition-colors group/sort" onClick={() => handleSort('data')}>
                                                                        <div className="flex items-center justify-center gap-1">Data<div className={`flex flex-col ${sortColumn === 'data' ? 'opacity-100' : 'opacity-30'}`}><Icon name="chevron-up" className={`w-3 h-3 ${sortColumn === 'data' && sortOrder === 'asc' ? 'text-indigo-600' : ''}`} /><Icon name="chevron-down" className={`w-3 h-3 ${sortColumn === 'data' && sortOrder === 'desc' ? 'text-indigo-600' : ''}`} /></div></div>
                                                                    </th>
                                                                    <th className="w-[200px]">Número SEI</th>
                                                                    <th className="w-[70px] text-center">Pasta</th>
                                                                    <th className="w-[180px]">
                                                                        <div className="flex items-center gap-1">
                                                                            <span>Classificação</span>
                                                                            <ColumnFilterIcon value={filterDemanda} onChange={setFilterDemanda} options={sortedTiposDemanda} allLabel="Todas" />
                                                                        </div>
                                                                    </th>
                                                                    <th className="w-[140px]">
                                                                        <div className="flex items-center gap-1">
                                                                            <span>Autor</span>
                                                                            <ColumnFilterIcon value={filterAutor} onChange={setFilterAutor} options={AUTORES} allLabel="Todos" />
                                                                        </div>
                                                                    </th>
                                                                    <th className="w-auto">Objeto / Resumo</th>
                                                                    <th className="w-[90px] text-center">Ações</th>
                                                                </tr>
                                                            )}
                                                        </thead>
                                                        <tbody>
                                                            {paginatedRecords.length > 0 ? (
                                                                paginatedRecords.map((rec, i) => (
                                                                    <tr key={i} className={rec.urgente && isPrazosTab && !isGlobalSearchActive ? "bg-red-50/50" : ""}>
                                                                        {isGlobalSearchActive ? (
                                                                            <>
                                                                                <td className="text-[10px] font-black uppercase text-indigo-600 truncate" title={rec.categoria}>{rec.categoria === "Prazos MP" ? "PRAZOS" : rec.categoria.split(' - ')[0]}</td>
                                                                                <td className="font-mono text-slate-500 font-medium">{rec.data}</td>
                                                                                <td><div className="flex items-center gap-2 group/sei min-w-0"><span className="font-black text-slate-900 truncate min-w-0" title={rec.numSei}>{rec.numSei}</span><button onClick={() => copyToClipboard(rec.numSei)} className="p-1 text-slate-300 hover:text-indigo-600 transition-colors opacity-0 group-hover/sei:opacity-100 flex-shrink-0" aria-label="Copiar número SEI"><Icon name="copy" size={14} /></button></div></td>
                                                                                <td><Hyperlink url={rec.linkGDrive} /></td>
                                                                                <td className="font-bold text-[10px] text-slate-500 uppercase truncate" title={rec.tipoDemanda}>{rec.tipoDemanda}</td>
                                                                                <td className="font-bold text-slate-500 uppercase text-[10px] truncate" title={rec.autor}>{rec.autor}</td>
                                                                                <td><ExpandableObjectCell text={rec.objeto} /></td>
                                                                            </>
                                                                        ) : isPrazosTab ? (
                                                                            <>
                                                                                <td className="text-center font-mono font-bold text-slate-400">{rec.displayId}</td>
                                                                                <td className="text-center">
                                                                                    {rec.urgente && <div className="inline-flex p-1 bg-red-100 text-red-600 rounded-full pulse-red" title="URGENTE"><Icon name="siren" size={14} /></div>}
                                                                                </td>
                                                                                <td className="text-center font-black text-slate-700 text-xs">{rec.prazo ? formatDate(rec.prazo) : "-"}</td>
                                                                                <td className="text-center"><div className="flex justify-center"><PrazoCell prazoStr={rec.prazo} status={rec.status} /></div></td>
                                                                                <td className="text-center"><StatusBadge status={rec.status} /></td>
                                                                                <td><div className="flex items-center gap-2 group/sei min-w-0"><span className="font-bold text-slate-900 truncate min-w-0 text-xs" title={rec.numSei}>{rec.numSei}</span><button onClick={() => copyToClipboard(rec.numSei)} className="p-1 text-slate-300 hover:text-indigo-600 transition-colors opacity-0 group-hover/sei:opacity-100 flex-shrink-0" aria-label="Copiar número SEI"><Icon name="copy" size={12} /></button></div></td>
                                                                                <td><Hyperlink url={rec.linkGDrive} /></td>
                                                                                <td className="font-bold text-slate-500 uppercase text-[10px] truncate" title={rec.autor}>{rec.autor.split(' ')[0]}</td>
                                                                                <td><ExpandableObjectCell text={rec.objeto} /></td>
                                                                            </>
                                                                        ) : (
                                                                            <>
                                                                                <td className="text-center font-mono font-bold text-slate-400">{rec.displayId}</td>
                                                                                <td className="text-center font-mono text-slate-500 font-medium">{rec.data}</td>
                                                                                <td><div className="flex items-center gap-2 group/sei min-w-0"><span className="font-black text-slate-900 truncate min-w-0" title={rec.numSei}>{rec.numSei}</span><button onClick={() => copyToClipboard(rec.numSei)} className="p-1 text-slate-300 hover:text-indigo-600 transition-colors opacity-0 group-hover/sei:opacity-100 flex-shrink-0" aria-label="Copiar número SEI"><Icon name="copy" size={14} /></button></div></td>
                                                                                <td><Hyperlink url={rec.linkGDrive} /></td>
                                                                                <td className="font-bold text-[10px] text-slate-500 uppercase truncate" title={rec.tipoDemanda}>{rec.tipoDemanda}</td>
                                                                                <td className="font-bold text-slate-500 uppercase text-[10px] truncate" title={rec.autor}>{rec.autor}</td>
                                                                                <td><ExpandableObjectCell text={rec.objeto} /></td>
                                                                            </>
                                                                        )}
                                                                        <td className="text-center"><div className="flex items-center justify-center gap-1"><button onClick={() => { 
                                                                            setEditMode(true); 
                                                                            setOriginalNumSei(rec.numSei);
                                                                            const days = calculateDaysLeft(rec.prazo);
                                                                            setDaysInput(days !== null ? days : "");
                                                                            const prazoIso = toISODate(formatDate(rec.prazo));
                                                                            setFormData({ ...rec, numManual: rec.displayId, dataManual: toISODate(rec.data), prazo: prazoIso, status: rec.status, urgente: rec.urgente }); 
                                                                            setDuplicateWarning(false);
                                                                            setShowModal(true);
