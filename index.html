                                                                        }} className="p-1.5 text-slate-400 hover:text-indigo-600 transition-all" aria-label="Editar registro"><Icon name="edit-3" size={14} /></button><button onClick={() => setDelConfirm({ show: true, numSei: rec.numSei, cat: rec.categoria })} className="p-1.5 text-slate-400 hover:text-rose-600 transition-all" aria-label="Excluir registro"><Icon name="trash-2" size={14} /></button></div></td>
                                                                    </tr>
                                                                ))
                                                            ) : (
                                                                <tr><td colSpan={(isPrazosTab && !isGlobalSearchActive) ? "10" : "8"} className="px-6 py-24 text-center border-none">
                                                                    <div className="flex flex-col items-center gap-3 text-slate-300">
                                                                        <div className="bg-slate-50 p-4 rounded-2xl"><Icon name="search-x" size={28} className="text-slate-300" /></div>
                                                                        <p className="font-bold text-slate-400 text-sm">Nenhum registro encontrado</p>
                                                                        <p className="text-xs font-medium text-slate-300">Ajuste os filtros ou verifique outro canal.</p>
                                                                    </div>
                                                                </td></tr>
                                                            )}
                                                        </tbody>
                                                    </table>
                                                    {visibleCount < displayRecords.length && (
                                                        <div className="p-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-center"><button onClick={() => setVisibleCount(prev => prev + 100)} className="px-8 py-3 bg-white border border-slate-200 rounded-xl text-[10px] font-black text-slate-500 hover:bg-slate-100 transition-all shadow-sm uppercase tracking-widest">Carregar mais registros</button></div>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="mt-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <div className="flex items-center gap-2">
                            <Icon name="database" size={12} className="text-emerald-500" />
                            <span>Sincronizado com Google Planilhas</span>
                        </div>
                        <span>GEPOP &copy; {new Date().getFullYear()}</span>
                    </footer>

                    {}
                    {showModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={() => !syncing && setShowModal(false)}></div>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[95vh] overflow-hidden flex flex-col relative animate-in zoom-in-95">
                                <div className="p-6 md:p-8 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                                    <div>
                                        <p className="text-[9px] font-black uppercase tracking-widest text-indigo-500 mb-1">{editMode ? "Edição" : "Novo lançamento"}</p>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-900 tracking-tight uppercase">{editMode ? "Editar Registro" : "Novo Registro"}</h3>
                                    </div>
                                    <button onClick={() => !syncing && setShowModal(false)} className="text-3xl font-light hover:bg-slate-200 w-10 h-10 rounded-full flex items-center justify-center transition-all" aria-label="Fechar formulário">&times;</button>
                                </div>
                                <div className="overflow-y-auto p-10 space-y-6 no-scrollbar">
                                    <form id="seiForm" onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="col-span-2"><label className="text-[10px] font-black uppercase text-slate-400 block px-1 mb-2 tracking-widest">Canal de Destino</label>
                                            <select 
                                                required 
                                                className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-slate-800 outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all" 
                                                value={formData.categoria} 
                                                onChange={e => {
                                                    const newCat = e.target.value;
                                                    setFormData({...formData, categoria: newCat});
                                                    if (formData.numSei) {
                                                        const isDup = checkDuplicate(formData.numSei, newCat, originalNumSei);
                                                        setDuplicateWarning(isDup);
                                                    } else {
                                                        setDuplicateWarning(false);
                                                    }
                                                }}
                                            >
                                                {CATEGORIAS.map(c => <option key={c} value={c}>{c === "Prazos MP" ? "PRAZOS" : c}</option>)}
                                            </select>
                                        </div>
                                        
                                        {formData.categoria === "Prazos MP" && (
                                            <div className="col-span-2 bg-slate-50 p-6 rounded-2xl border border-indigo-100 flex flex-col md:flex-row gap-6 animate-fade-in relative overflow-hidden">
                                                <div className="absolute top-0 right-0 p-2 opacity-10"><Icon name="clock" size={80} className="text-indigo-500" /></div>
                                                
                                                <div className="flex-1 space-y-2 relative z-10">
                                                    <label className="text-[10px] font-black uppercase text-indigo-500 tracking-widest px-1">Prazo (Em Dias)</label>
                                                    <input 
                                                        required 
                                                        type="number" 
                                                        placeholder="Ex: 15"
                                                        className="w-full px-5 py-3 border-2 border-indigo-100 rounded-xl font-bold text-slate-700 focus:border-indigo-500 outline-none" 
                                                        value={daysInput} 
                                                        onChange={e => handleDaysChange(e.target.value)} 
                                                    />
                                                    {formData.prazo && (
                                                        <p className="text-[10px] font-bold text-indigo-400 pl-2 animate-fade-in">
                                                            Vence em: {formatDate(formData.prazo)}
                                                        </p>
                                                    )}
                                                </div>

                                                <div className="flex-1 space-y-2 relative z-10">
                                                    <label className="text-[10px] font-black uppercase text-indigo-500 tracking-widest px-1">Status Atual</label>
                                                    <select required className="w-full px-5 py-3 border-2 border-indigo-100 rounded-xl font-bold text-slate-700 focus:border-indigo-500 outline-none" value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}>
                                                        {STATUS_OPCOES.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>
                                                <div className="flex flex-col justify-center space-y-2 relative z-10">
                                                    <label className="text-[10px] font-black uppercase text-indigo-500 tracking-widest px-1">Prioridade</label>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-xs font-bold text-slate-400">Normal</span>
                                                        <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                                            <input type="checkbox" name="toggle" id="toggle" className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300" checked={formData.urgente} onChange={e => setFormData({...formData, urgente: e.target.checked})} />
                                                            <label htmlFor="toggle" className="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer"></label>
                                                        </div>
                                                        <span className={`text-xs font-bold ${formData.urgente ? "text-rose-600" : "text-slate-400"}`}>URGENTE</span>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <div className="space-y-1">
                                            <div className="flex justify-between items-center px-1">
                                                <label className="text-[10px] font-black uppercase text-slate-400">Número SEI</label>
                                                {editMode && (
                                                    <span className="text-[9px] font-bold text-indigo-600 uppercase">Editável</span>
                                                )}
                                            </div>
                                            <input 
                                                required 
                                                placeholder="Número SEI" 
                                                className="w-full px-6 py-4 bg-white border border-slate-200 rounded-2xl font-black text-slate-800 outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all shadow-inner" 
                                                value={formData.numSei} 
                                                onChange={e => {
                                                    const val = e.target.value;
                                                    setFormData({...formData, numSei: val});
                                                    const isDup = checkDuplicate(val, formData.categoria, originalNumSei);
                                                    setDuplicateWarning(isDup);
                                                }} 
                                            />
                                            {duplicateWarning && (
                                                <div className="flex items-center gap-2 mt-2 text-amber-600 bg-amber-50 p-3 rounded-lg border border-amber-200 animate-in fade-in slide-in-from-top-1">
                                                    <Icon name="alert-triangle" size={16} />
                                                    <span className="text-xs font-bold uppercase">Atenção: Este Número SEI já está registrado em outro item!</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 px-1">Link GDrive</label>
                                            <input 
                                                type="text"
                                                name="linkGDrive"
                                                placeholder="https://drive.google.com/..." 
                                                className="w-full px-6 py-4 bg-white border border-slate-200 rounded-2xl font-black text-slate-800 outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all shadow-inner" 
                                                value={formData.linkGDrive || ""} 
                                                onChange={e => {
                                                    const val = e.target.value;
                                                    setFormData(prev => ({...prev, linkGDrive: val}));
                                                }} 
                                            />
                                            {formData.linkGDrive && (
                                                <p className="text-[9px] font-bold text-indigo-500 pl-2 mt-1 truncate">Link detectado: {formData.linkGDrive}</p>
                                            )}
                                        </div>

                                        <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 px-1">Autor</label><select required className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black outline-none" value={formData.autor} onChange={e => setFormData({...formData, autor: e.target.value})}><option value="">Selecionar Autor...</option>{AUTORES.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                                        
                                        <SearchableSelect 
                                            label="Classificação / Tipo"
                                            placeholder="Selecione ou digite para criar novo..."
                                            options={sortedTiposDemanda}
                                            value={formData.tipoDemanda}
                                            allowNew={true}
                                            onChange={(val) => {
                                                setFormData({...formData, tipoDemanda: val});
                                                if (val && !dynamicTiposDemanda.includes(val)) {
                                                    setDynamicTiposDemanda(prev => [...prev, val]);
                                                }
                                            }}
                                        />

                                        {(formData.categoria.includes("Ofício") || editMode) && (
                                            <div className="col-span-2 grid grid-cols-2 gap-4 p-4 rounded-2xl border bg-slate-50 border-slate-200 animate-fade-in">
                                                <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 px-1">Nº Manual</label><input readOnly={!formData.categoria.includes("Ofício") && editMode} required type="text" placeholder="Ex: 001/2026" className={`w-full px-5 py-3.5 border bg-white border-slate-200 rounded-xl font-black outline-none ${(!formData.categoria.includes("Ofício") && editMode) ? 'bg-slate-100 text-slate-400' : ''}`} value={formData.numManual} onChange={e => setFormData({...formData, numManual: e.target.value})} /></div>
                                                <div className="space-y-1"><label className="text-[10px] font-black uppercase text-slate-400 px-1">Data</label><input required type="date" className="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-xl font-black outline-none focus:border-indigo-500" value={formData.dataManual} onChange={e => setFormData({...formData, dataManual: e.target.value})} /></div>
                                            </div>
                                        )}
                                        
                                        <textarea required placeholder="Resumo do objeto..." rows="4" className="col-span-2 px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-medium outline-none resize-none transition-all focus:border-slate-900" value={formData.objeto} onChange={e => setFormData({...formData, objeto: e.target.value})}></textarea>
                                    </form>
                                </div>
                                <div className="p-8 border-t bg-slate-50 flex gap-4">
                                    <button onClick={() => setShowModal(false)} className="flex-1 py-4 font-black text-slate-400 uppercase tracking-widest text-[10px]">Cancelar</button>
                                    <button form="seiForm" disabled={syncing} className="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-black shadow-sm flex items-center justify-center gap-3 active:scale-95 disabled:opacity-50 transition-all text-xs uppercase tracking-widest">{syncing ? <div className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div> : <Icon name="check-circle" />}{editMode ? "Atualizar Registro" : "Sincronizar e Salvar"}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {delConfirm.show && (
                        <div className="fixed inset-0 z-[150] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-sm" onClick={() => !syncing && setDelConfirm({ show: false, numSei: "", cat: "" })}></div>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 relative animate-in zoom-in-95">
                                <div className="bg-rose-50 w-16 h-16 rounded-2xl flex items-center justify-center text-rose-600 mb-6 mx-auto"><Icon name="trash-2" size={32} /></div>
                                <h3 className="text-xl font-black text-slate-900 text-center mb-2 uppercase">Excluir Registro?</h3>
                                <p className="text-slate-500 text-center mb-8 font-medium">Esta ação não pode ser desfeita. Deseja realmente remover o SEI <span className="font-black text-slate-900">{delConfirm.numSei}</span>?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDelConfirm({ show: false, numSei: "", cat: "" })} className="flex-1 py-4 font-black text-slate-400 uppercase text-[10px]">Cancelar</button>
                                    <button onClick={handleDelete} disabled={syncing} className="flex-1 bg-rose-600 text-white py-4 rounded-xl font-black shadow-lg shadow-rose-200 flex items-center justify-center gap-2 active:scale-95 transition-all text-[10px] uppercase">{syncing ? "Excluindo..." : "Confirmar Exclusão"}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
